<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Renato's Lanches</title>
</head>

<body>
    <div class="container">
        <header class="container__header" id="headerIndex">
            <nav class="menu">
                <img src="imgs/Logo Renato’s Lanches com Hambúrguer Glossy.png" alt="Renato's" class="menu__img">
                <ul class="menu__list">
                    <li class="menu__item"><a href="#" class="menu__link">link</a></li>
                    <li class="menu__item"><a href="#" class="menu__link">link</a></li>
                    <li class="menu__item"><a href="#" class="menu__link">link</a></li>
                    <li class="menu__item"><a href="#" class="menu__link">link</a></li>
                    <li class="menu__item"><a href="#" class="menu__link">link</a></li>
                </ul>
                <div class="content_btn">
                    <button class="menu__button"><i class="fa-solid fa-burger"></i>Peça agora</button>
                </div>
            </nav>
        </header>

        <main class="container__main" id="mainIndex">
            <section class="hero">
                <p class="hero__text">BEM VINDO AO</p>
                <img src="imgs/Logo Glossy Renato’s Lanches.png" alt="" class="hero__img">
                <p class="hero__text">Sabor, qualidade e aquele lanche <br>  que faz seu dia fixar melhor!</p>
            </section>
            <section class="bio">
                <img src="imgs/" alt="" class="bio__img">
                <div class="desc">
                    <h2 class="desc__sub_title"></h2>
                    <h1 class="desc__title"></h1>
                    <p class="desc__title"></p>
                </div>
            </section>
            <section class="menu">
                <div class="hero">
                    <div class="hero__string">
                        <h1 class="hero__sub_title"></h1>
                        <h1 class="hero__title"></h1>
                        <p class="hero__text"></p>
                    </div>
                    <button class="hero__button">Ver cardápio completo</button>
                </div>
                <div class="slider" id="sliderMenu"></div>
            </section>
            <section class="contacts">
                <div class="info">
                    <div class="strings">
                        <h2 class="info__sub_title"></h2>
                        <h1 class="info__title"></h1>
                        <p class="info__text"></p>
                    </div>
                    <ul class="info__list">
                        <li class="info__item">
                            <div class="card">
                                <img src="imgs/" alt="" class="card__img">
                                <h1 class="card__title"></h1>
                                <p class="card__text"></p>
                            </div>
                        </li>
                        <li class="info__item">
                            <div class="card">
                                <img src="imgs/" alt="" class="card__img">
                                <h1 class="card__title"></h1>
                                <p class="card__text"></p>
                            </div>
                        </li>
                        <li class="info__item">
                            <div class="card">
                                <img src="imgs/" alt="" class="card__img">
                                <h1 class="card__title"></h1>
                                <p class="card__text"></p>
                            </div>
                        </li>
                        <li class="info__item">
                            <div class="card">
                                <img src="imgs/" alt="" class="card__img">
                                <h1 class="card__title"></h1>
                                <p class="card__text"></p>
                            </div>
                        </li>
                    </ul>
                    <div class="locate">
                        <img src="imgs/" alt="" class="locate__img">
                        <p class="locate__text"></p>
                    </div>
                </div>
                <form action="" method="" class="menssage">
                    <h1 class="menssage__title"></h1>
                    <input type="text" name="" id="" class="menssage__in">
                    <input type="email" name="" id="" class="menssage__in">
                    <input type="text" name="" id="" class="menssage__in_msg">
                    <button type="submit" class="menssage__button"></button>
                </form>
            </section>
        </main>
        <footer class="container__footer" id="footerIndex">
            <img src="/imgs" alt="">
            <p>Renato's Lanches - Sabor que te acompanha!</p>
            <ul>
                <li></li>
                <li></li>
                <li></li>
                <li></li>
                <li></li>
            </ul>
        </footer>
    </div>
</body>
</html>
