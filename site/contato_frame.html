<!DOCTYPE html>
<html lang="pt-br">

<head>
    <link rel="stylesheet" href="css/style.css">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Renato's Lanches - Contatos</title>
</head>

<body>
    <div class="container" id="c-contato">
        <header class="header">
            <nav class="header_menu" id="menuIndex"></nav>
        </header>
        <main class="content">
            <div class="content_item" id="c-contacts">
                <div class="c-contacts_item">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="Whatsaap" srcset="">
                    <div>
                        <h2>(11) 941126-480</h2>
                        <p>faleconosco no whatsaap</p>
                    </div>
                </div>
                <div class="c-contacts_item">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/7/7e/Gmail_icon_%282020%29.svg" alt="Whatsaap" srcset="">
                    <div>
                        <h2>renatoslanches@gmail.com</h2>
                        <p>Respondemos em breve</p>
                    </div>
                </div>
                <div class="c-contacts_item">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/a/aa/Google_Maps_icon_%282020%29.svg" alt="Whatsaap" srcset="">
                    <div>
                        <h2>Rua das Delicias, 123<br>Centro São Paulo/SP</h2>
                        <p>Venha nos visitar!</p>
                    </div>
                </div>
            </div>

            <div class="content_item" id="c-forms">
                <form action="#" method="get" id="c-formsFormulario">
                    <input type="text" name="nome" id="inNome" placeholder="Nome" required>
                    <input type="email" name="email" id="inEmail" placeholder="E-mail" required>
                    <input type="tel" name="email" id="inEmail" placeholder="Telefone" required>
                    <input type="text" name="mensage" id="inMensage" placeholder="Mensagem">
                    <button id="c-formsBtn" type="submit">ENVIAR MENSAGEM</button>
                </form>
            </div>
        </main>
        <footer class="footer" id="footerIndex"></footer>
    </div>

    <script type="module" src="js/main.js"></script>
</body>

</html>
