<!DOCTYPE html>
<html lang="pt-br">

<head>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="stylesheet" href="css/style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardápio | Renato's Lanches</title>
    <link rel="icon" type="image/png" href="./imgs/logoIco.ico">
</head>

<body>
    <div class="container">
        <header class="container__header" id="headerIndex">
            <a href="index.html" class="cardapio__voltar"><i class="fa-solid fa-arrow-left"></i>Voltar ao início</a>
        </header>

        <main class="container__main" id="mainIndex">
            <section class="cardapio-page" id="cardapio">

                <div class="cardapio-page__intro">
                    <h2 class="cardapio-page__subtitulo">FEITO COM CARINHO</h2>
                    <h1 class="cardapio-page__titulo">Nosso <span>Cardápio</span></h1>
                    <p class="cardapio-page__descricao">Seu próximo lanche favorito está aqui.<br>Escolha o seu e aproveite!</p>
                </div>

                <div class="cardapio-page__produtos" id="listaProdutos">
                    <p class="cardapio-page__carregando">Carregando nosso cardápio...</p>
                </div>

            </section>

        </main>

        <footer class="container__footer" id="footerIndex">
            <img src="imgs/Logo Renato’s Lanches com Hambúrguer Glossy.png" alt="Renato's Lanches">

            <p>Renato's Lanches • Sabor que te acompanha!</p>

            <a href="index.html" class="cardapio__voltar-footer"><i class="fa-solid fa-house"></i>Voltar ao início</a>
        </footer>

    </div>

    <script type="module" src="js/main.js"></script>
</body>

</html>
